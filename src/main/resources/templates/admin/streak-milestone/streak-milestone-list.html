<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Mirrored from themesflat.co/html/remos/add-attributes.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 02 Apr 2025 06:41:48 GMT -->
<head th:insert="~{admin/fragments/head::head}"></head>

<body class="body">

<!-- #wrapper -->
<div id="wrapper">
    <!-- #page -->
    <div id="page" class="">
        <!-- layout-wrap -->
        <div class="layout-wrap">
            <!-- preload -->
            <div id="preload" class="preload-container">
                <div class="preloading">
                    <span></span>
                </div>
            </div>
            <!-- /preload -->
            <!-- section-menu-left -->
            <div th:insert="~{admin/fragments/menu-left::section-menu-left}"></div>
            <!-- /section-menu-left -->
            <!-- section-content-right -->
            <div class="section-content-right">
                <!-- header-dashboard -->
                <div th:insert="~{admin/fragments/header_dashboard::header-dashboard}"></div>
                <!-- /header-dashboard -->
                <!-- main-content -->
                <div class="main-content">
                    <!-- main-content-wrap -->
                    <div class="main-content-inner">
                        <!-- main-content-wrap -->
                        <div class="main-content-wrap">
                            <div class="flex items-center flex-wrap justify-between gap20 mb-27">
                                <h3>Streak Milestone List</h3>
                                <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                                    <li>
                                        <a th:href="@{/admin}">
                                            <div class="text-tiny">Dashboard</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <a th:href="@{/admin/streak-milestones}">
                                            <div class="text-tiny">Streak Milestone</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <div class="text-tiny">Streak Milestone List</div>
                                    </li>
                                </ul>
                            </div>
                            <!-- section-list -->
                            <div class="wg-box">
                                <div class="flex items-center justify-between gap10 flex-wrap">
                                    <a class="tf-button style-1 w208" th:href="@{/admin/streak-milestones/create}"><i
                                            class="icon-plus"></i>Add Streak Milestone</a>

                                    <div class="flex items-center gap10">
                                        <span>Sort by:</span>
                                        <a th:href="@{/admin/streak-milestones(page=${currentPage}, size=${pageSize}, direction='ASC')}"
                                           class="tf-button style-2" th:classappend="${direction == 'ASC' ? 'active' : ''}">
                                            Ascending
                                        </a>
                                        <a th:href="@{/admin/streak-milestones(page=${currentPage}, size=${pageSize}, direction='DESC')}"
                                           class="tf-button style-2" th:classappend="${direction == 'DESC' ? 'active' : ''}">
                                            Descending
                                        </a>
                                    </div>
                                </div>
                                <div class="wg-table table-all-roles">
                                    <ul class="table-title flex mb-14">
                                        <li style="width: 5%;">
                                            <div class="body-title">ID</div>
                                        </li>
                                        <li style="width: 10%;">
                                            <div class="body-title">Day Target</div>
                                        </li>
                                        <li style="width: 20%;">
                                            <div class="body-title">Title</div>
                                        </li>
                                        <li style="width: 45%;">
                                            <div class="body-title">Description</div>
                                        </li>
                                        <li style="width: 15%;">
                                            <div class="body-title">Updated At</div>
                                        </li>
                                        <li style="width: 5%;">
                                            <div class="body-title">Action</div>
                                        </li>
                                    </ul>
                                    <ul class="list">
                                        <li class="roles-item flex items-center" th:each="milestone : ${streakMilestonesPage.content}">
                                            <div style="width: 5%;" class="body-text" th:text="${milestone.id}"></div>
                                            <div style="width: 10%;" class="body-text" th:text="${milestone.dayTarget}"></div>
                                            <div style="width: 20%;" class="body-text" th:text="${milestone.title}"></div>
                                            <div style="width: 45%;" class="body-text text-truncate" th:text="${milestone.description}"></div>
                                            <div style="width: 15%;" class="body-text" th:text="${milestone.updatedAt}"></div>
                                            <div style="width: 5%;" class="list-icon-function">
                                                <div class="item edit">
                                                    <a class="icon-edit"
                                                       th:href="@{/admin/streak-milestones/{id}(id=${milestone.id})}"></a>
                                                </div>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                                <div class="divider"></div>
                                <div class="flex items-center justify-between flex-wrap gap10">
                                    <div class="text-tiny" th:text="'Showing ' + ${streakMilestonesPage.numberOfElements} + ' out of ' + ${streakMilestonesPage.totalElements} + ' entries'"></div>
                                    <div class="pagination-container" th:if="${streakMilestonesPage.totalPages > 1}">
                                        <ul class="wg-pagination flex items-center justify-center gap-2">
                                            <!-- First Page -->
                                            <li th:class="${currentPage == 0} ? 'disabled' : ''">
                                                <a th:href="@{/admin/streak-milestones(page=0, size=${pageSize}, direction=${direction})}"
                                                   class="page-link">&laquo;</a>
                                            </li>

                                            <!-- Previous Page -->
                                            <li th:class="${currentPage == 0} ? 'disabled' : ''">
                                                <a th:href="@{/admin/streak-milestones(page=${currentPage - 1}, size=${pageSize}, direction=${direction})}"
                                                   class="page-link">&lt;</a>
                                            </li>

                                            <!-- Page Numbers -->
                                            <li th:each="i : ${#numbers.sequence(0, streakMilestonesPage.totalPages - 1)}"
                                                th:if="${i >= currentPage - 2 and i <= currentPage + 2}"
                                                th:class="${currentPage == i} ? 'active' : ''">
                                                <a th:href="@{/admin/streak-milestones(page=${i}, size=${pageSize}, direction=${direction})}"
                                                   class="page-link" th:text="${i + 1}"></a>
                                            </li>

                                            <!-- Next Page -->
                                            <li th:class="${currentPage == streakMilestonesPage.totalPages - 1} ? 'disabled' : ''">
                                                <a th:href="@{/admin/streak-milestones(page=${currentPage + 1}, size=${pageSize}, direction=${direction})}"
                                                   class="page-link">&gt;</a>
                                            </li>

                                            <!-- Last Page -->
                                            <li th:class="${currentPage == streakMilestonesPage.totalPages - 1} ? 'disabled' : ''">
                                                <a th:href="@{/admin/streak-milestones(page=${streakMilestonesPage.totalPages - 1}, size=${pageSize}, direction=${direction})}"
                                                   class="page-link">&raquo;</a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <!-- /section-list -->
                        </div>
                        <!-- /main-content-wrap -->
                    </div>
                    <!-- /main-content-wrap -->
                    <!-- bottom-page -->
                    <div th:insert="~{admin/fragments/bottom_page::bottom-page}"></div>
                    <!-- /bottom-page -->
                </div>
                <!-- /main-content -->
            </div>
            <!-- /section-content-right -->
        </div>
        <!-- /layout-wrap -->
    </div>
    <!-- /#page -->
</div>
<!-- /#wrapper -->

<!-- Javascript -->
<div th:insert="~{admin/fragments/script::script}"></div>

</body>

</html>

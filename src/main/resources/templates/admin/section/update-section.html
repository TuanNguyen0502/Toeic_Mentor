<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">

<!-- Mirrored from themesflat.co/html/remos/add-attributes.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 02 Apr 2025 06:41:48 GMT -->
<head th:insert="~{admin/fragments/head::head}"></head>

<style>
    /* Custom styles for the question list table */
    .table-title li:nth-child(1) {
        width: 50px; /* ID column - small */
    }
    .table-title li:nth-child(2) {
        width: 50px; /* Part column - small */
    }
    .table-title li:nth-child(3) {
        width: 80px; /* Status column - shorter */
    }
    .table-title li:nth-child(4) {
        width: 350px; /* Text column - wider */
    }
    .table-title li:nth-child(5) {
        width: 100px; /* Answer column */
    }
    .table-title li:nth-child(6) {
        width: 100px; /* Tags column */
    }
    .table-title li:nth-child(7) {
        width: 80px; /* Action column */
    }

    /* Matching widths for the data rows */
    .roles-item > div:nth-child(1) {
        width: 50px; /* ID column */
    }
    .roles-item > div:nth-child(2) {
        width: 50px; /* Part column */
    }
    .roles-item > div:nth-child(3) {
        width: 80px; /* Status column */
    }
    .roles-item > div:nth-child(4) {
        width: 350px; /* Text column */
        max-width: 350px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .roles-item > div:nth-child(5) {
        width: 100px; /* Answer column */
    }
    .roles-item > div:nth-child(6) {
        width: 100px; /* Tags column */
    }
    .roles-item > div:nth-child(7) {
        width: 80px; /* Action column */
    }
</style>

<body class="body">

<!-- #wrapper -->
<div id="wrapper">
    <!-- #page -->
    <div id="page" class="">
        <!-- layout-wrap -->
        <div class="layout-wrap">
            <!-- preload -->
            <div id="preload" class="preload-container">
                <div class="preloading">
                    <span></span>
                </div>
            </div>
            <!-- /preload -->
            <!-- section-menu-left -->
            <div th:insert="~{admin/fragments/menu-left::section-menu-left}"></div>
            <!-- /section-menu-left -->
            <!-- section-content-right -->
            <div class="section-content-right">
                <!-- header-dashboard -->
                <div th:insert="~{admin/fragments/header_dashboard::header-dashboard}"></div>
                <!-- /header-dashboard -->
                <!-- main-content -->
                <div class="main-content">
                    <!-- main-content-wrap -->
                    <div class="main-content-inner">
                        <!-- main-content-wrap -->
                        <div class="main-content-wrap">
                            <div class="flex items-center flex-wrap justify-between gap20 mb-27">
                                <h3>Section information</h3>
                                <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                                    <li>
                                        <a th:href="@{/admin}">
                                            <div class="text-tiny">Dashboard</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <a th:href="@{/admin/sections}">
                                            <div class="text-tiny">Section</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <div class="text-tiny">Section Detail</div>
                                    </li>
                                </ul>
                            </div>
                            <!-- update-section -->
                            <div class="wg-box">
                                <div class="block-warning" th:if="${error}">
                                    <i class="icon-alert-octagon"></i>
                                    <div class="body-title-2" th:text="${error}"></div>
                                </div>
                                <form th:action="@{/admin/sections/{id}(id=${sectionUpdateDTO.getId()})}" method="post"
                                      class="form-new-product form-style-1" th:object="${sectionUpdateDTO}">

                                    <fieldset class="name">
                                        <div class="body-title">Title <span class="tf-color-1">*</span></div>
                                        <input class="flex-grow" type="text" placeholder="Section's title" name="title"
                                               tabindex="0" aria-required="true" required="required"
                                               th:field="*{title}">
                                        <div class="block-warning" th:if="${#fields.hasErrors('title')}">
                                            <i class="icon-alert-octagon"></i>
                                            <div class="body-title-2" th:errors="*{title}"></div>
                                        </div>
                                    </fieldset>

                                    <fieldset class="name">
                                        <div class="body-title">Section status <span class="tf-color-1">*</span></div>
                                        <div class="select">
                                            <select class="" th:field="*{status}">
                                                <option th:each="status : ${eSectionStatus}"
                                                        th:value="${status}"
                                                        th:text="${status.name()}">
                                                </option>
                                            </select>
                                        </div>
                                    </fieldset>

                                    <fieldset class="name">
                                        <div class="body-title">Part</div>
                                        <input class="flex-grow" type="text" placeholder="Section's parts" name="parts"
                                               tabindex="0" readonly="readonly" th:field="*{parts}">
                                    </fieldset>

                                    <div class="bot">
                                        <div></div>
                                        <button class="tf-button w208" type="submit">Save</button>
                                    </div>
                                </form>
                            </div>
                            <!-- /update-section -->
                            <!-- question-list -->
                            <div class="wg-box">
                                <div class="flex items-center justify-between gap10 flex-wrap">
                                    <a class="tf-button style-1 w208"
                                       th:href="@{/admin/sections/add-questions/{id}(id=${sectionUpdateDTO.getId()})}">
                                        <i class="icon-plus"></i>Add Question</a>
                                </div>
                                <div class="wg-table table-all-roles">
                                    <style>
                                        /* Fix alignment issues in the table */
                                        .custom-table {
                                            display: table;
                                            width: 100%;
                                            border-collapse: collapse;
                                        }
                                        .custom-table-header, .custom-table-row {
                                            display: table-row;
                                        }
                                        .custom-table-header > div, .custom-table-row > div {
                                            display: table-cell;
                                            padding: 8px;
                                            vertical-align: middle;
                                        }
                                        .custom-table-cell-id {
                                            width: 50px;
                                        }
                                        .custom-table-cell-part {
                                            width: 50px;
                                        }
                                        .custom-table-cell-status {
                                            width: 80px;
                                        }
                                        .custom-table-cell-text {
                                            width: 350px;
                                            max-width: 350px;
                                            overflow: hidden;
                                            text-overflow: ellipsis;
                                            white-space: nowrap;
                                        }
                                        .custom-table-cell-answer {
                                            width: 100px;
                                        }
                                        .custom-table-cell-tags {
                                            width: 100px;
                                        }
                                        .custom-table-cell-action {
                                            width: 80px;
                                        }
                                    </style>

                                    <div class="custom-table mb-14">
                                        <div class="custom-table-header">
                                            <div class="custom-table-cell-id">
                                                <div class="body-title">ID</div>
                                            </div>
                                            <div class="custom-table-cell-part">
                                                <div class="body-title">Part</div>
                                            </div>
                                            <div class="custom-table-cell-status">
                                                <div class="body-title">Status</div>
                                            </div>
                                            <div class="custom-table-cell-text">
                                                <div class="body-title">Text</div>
                                            </div>
                                            <div class="custom-table-cell-answer">
                                                <div class="body-title">Answer</div>
                                            </div>
                                            <div class="custom-table-cell-tags">
                                                <div class="body-title">Tags</div>
                                            </div>
                                            <div class="custom-table-cell-action">
                                                <div class="body-title">Action</div>
                                            </div>
                                        </div>

                                        <div class="custom-table-row" th:each="questionResponse : ${questionResponse}">
                                            <div class="custom-table-cell-id">
                                                <div class="body-text" th:text="${questionResponse.getId()}"></div>
                                            </div>
                                            <div class="custom-table-cell-part">
                                                <div class="body-text" th:text="${questionResponse.getPart()}"></div>
                                            </div>
                                            <div class="custom-table-cell-status">
                                                <div class="body-text" th:switch="${questionResponse.getStatus()}">
                                                    <div class="flex-center status-pending"
                                                         th:case="'IN_SECTION'"
                                                         th:text="${questionResponse.getStatus()}">
                                                    </div>
                                                    <div class="flex-center status-delivered"
                                                         th:case="'APPROVED'"
                                                         th:text="${questionResponse.getStatus()}">
                                                    </div>
                                                    <div class="flex-center status-cancelled"
                                                         th:case="'DELETED'"
                                                         th:text="${questionResponse.getStatus()}">
                                                    </div>
                                                    <div class="flex-center"
                                                         th:case="*"
                                                         th:text="${questionResponse.getStatus()}">
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="custom-table-cell-text">
                                                <div class="body-text" th:text="${questionResponse.getText()}"></div>
                                            </div>
                                            <div class="custom-table-cell-answer">
                                                <div class="body-text" th:text="${questionResponse.getCorrectAnswer()}"></div>
                                            </div>
                                            <div class="custom-table-cell-tags">
                                                <div class="body-text" th:text="${questionResponse.getTags()}"></div>
                                            </div>
                                            <div class="custom-table-cell-action">
                                                <div class="list-icon-function">
<!--                                                    <div class="item eye">-->
<!--                                                        <a class="icon-eye"-->
<!--                                                           th:href="@{/admin/sections/{id}(id=${questionResponse.getId()})}"></a>-->
<!--                                                    </div>-->
                                                    <div class="item edit">
                                                        <a class="icon-edit"
                                                           th:href="@{/admin/sections/{sectionId}/questions/{questionId}(sectionId=${sectionUpdateDTO.getId()},questionId=${questionResponse.getId()})}"></a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="divider"></div>
                                <div class="flex items-center justify-between flex-wrap gap10">
                                    <div class="text-tiny">Showing 10 entries</div>
                                    <ul class="wg-pagination listPage">
                                    </ul>
                                </div>
                            </div>
                            <!-- /question-list -->
                        </div>
                        <!-- /main-content-wrap -->
                    </div>
                    <!-- /main-content-wrap -->
                    <!-- bottom-page -->
                    <div th:insert="~{admin/fragments/bottom_page::bottom-page}"></div>
                    <!-- /bottom-page -->
                </div>
                <!-- /main-content -->
            </div>
            <!-- /section-content-right -->
        </div>
        <!-- /layout-wrap -->
    </div>
    <!-- /#page -->
</div>
<!-- /#wrapper -->

<!-- Javascript -->
<div th:insert="~{admin/fragments/script::script}"></div>
<script th:src="@{/admin/asset/js/pagination.js}"></script>
<script th:src="@{/admin/asset/js/search.js}"></script>

</body>


<!-- Mirrored from themesflat.co/html/remos/new-discount.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 02 Apr 2025 06:41:47 GMT -->
</html>

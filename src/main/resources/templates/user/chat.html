<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Mentor's Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-content code {
            background-color: #f0f0f0;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* Gradient animations */
        .gradient-animation {
            background: linear-gradient(-45deg, #3b82f6, #2563eb, #1d4ed8, #1e40af);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c5c5c5;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* Message animations */
        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .message-animation {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Glass effect */
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 h-screen flex flex-col">
<div class="flex flex-row h-full">
    <!-- Sidebar -->
    <div id="sidebar" class="w-64 bg-white shadow-xl p-0 hidden md:flex md:flex-col h-full border-r border-gray-200">
        <!-- Sidebar Header -->
        <div class="gradient-animation text-white p-4">
            <h2 class="text-lg font-bold tracking-wide">Conversations</h2>
            <p class="text-xs text-gray-200 mt-1">Your chat history</p>
        </div>

        <!-- Add Conversation Button -->
        <div class="px-4 py-3 border-b border-gray-200">
            <button id="add-conversation-btn"
                    class="w-full bg-white border-2 border-green-500 text-green-500 py-2 px-4 rounded-lg
                    hover:bg-green-500 hover:text-white focus:outline-none focus:ring-2 focus:ring-green-500
                    transition-all duration-200 flex items-center justify-center gap-2 font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                          d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                          clip-rule="evenodd"/>
                </svg>
                New Chat
            </button>
        </div>

        <!-- Conversation List Area -->
        <div class="flex-1 overflow-y-auto px-2 py-2">
            <ul id="conversation-list" class="space-y-1"></ul>
        </div>

        <!-- User Info Area -->
        <div class="border-t border-gray-200 p-4 bg-gray-50 flex items-center">
            <div class="bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-full h-10 w-10 flex items-center justify-center font-bold text-sm shadow-md">
                <span th:text="${#authentication?.name?.charAt(0)}">U</span>
            </div>
            <div class="ml-3">
                <div class="text-sm font-medium text-gray-900 truncate max-w-[160px]">
                    <span th:text="${#authentication?.name}">User</span>
                </div>
                <p class="text-xs text-gray-500">Online</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50">
        <!-- Header -->
        <div class="glass-effect sticky top-0 z-10 border-b border-gray-200 bg-white/80">
            <div class="flex justify-between items-center px-6 py-3">
                <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                    </svg>
                    Toeic Mentor's Chatbot
                </h1>
                <div class="flex items-center gap-2">
                    <a href="/"
                       class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
                        </svg>
                        Home
                    </a>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit"
                                class="bg-white text-red-500 px-4 py-2 rounded-lg border border-red-500
                                hover:bg-red-500 hover:text-white transition-colors duration-200
                                focus:outline-none focus:ring-2 focus:ring-red-500 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20"
                                 fill="currentColor">
                                <path fill-rule="evenodd"
                                      d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z"
                                      clip-rule="evenodd"/>
                            </svg>
                            Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Chat messages area -->
        <div class="flex-1 overflow-y-auto" id="chat-messages-container">
            <div id="chat-messages" class="max-w-4xl mx-auto p-4 space-y-4"></div>
        </div>

        <!-- Message input area -->
        <div class="glass-effect border-t border-gray-200 bg-white/80">
            <div class="max-w-4xl mx-auto p-4">
                <div id="image-preview" class="mb-3 hidden rounded-lg overflow-hidden relative">
                    <img id="preview-image" src="" alt="Preview" class="max-h-48 max-w-full mx-auto object-contain">
                    <button id="remove-image-btn" class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
                <form id="chat-form" class="flex items-center gap-2" enctype="multipart/form-data">
                    <div class="relative flex-1">
                        <input
                                type="text"
                                id="message-input"
                                name="message"
                                placeholder="Type your message..."
                                class="w-full p-4 pr-12 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white/50 backdrop-blur-sm"
                                required
                        >
                        <label for="image-input"
                               class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-gray-400 hover:text-blue-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                 stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <span id="image-selected"
                                  class="absolute -top-1 -right-1 h-3 w-3 bg-blue-500 rounded-full hidden"></span>
                        </label>
                        <input
                                type="file"
                                id="image-input"
                                name="image"
                                accept="image/*"
                                class="hidden"
                        >
                    </div>
                    <button
                            type="submit"
                            class="gradient-animation text-white px-6 py-4 rounded-xl hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200 shadow-lg flex items-center gap-2"
                    >
                        <span>Send</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                  d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z"
                                  clip-rule="evenodd"/>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const conversationId = [[${conversationId}]];
    const userEmail = [[${#authentication?.name
    }]]
    ;
    /*]]>*/
</script>
<script>
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const chatMessages = document.getElementById('chat-messages');

    // Load chat history on page load
    document.addEventListener('DOMContentLoaded', async function () {
        // Always use window.conversationId
        window.conversationId = conversationId;
        if (!window.conversationId) return;
        try {
            const response = await fetch(`/conversation?conversationId=${encodeURIComponent(window.conversationId)}`);
            if (response.ok) {
                const history = await response.json();
                // Display each message - they are now ChatbotResponse objects with messageType
                history.forEach(msg => {
                    // Pass the entire ChatbotResponse object to addMessageToChat
                    // The function will handle extracting content and determining sender
                    addMessageToChat(null, msg);
                });
            }
        } catch (e) {
            console.error('Failed to load chat history:', e);
        }

        // Sidebar: Load Conversations on page load
        const convList = document.getElementById('conversation-list');
        if (userEmail && convList) {
            convList.innerHTML = '<li class="text-gray-500">Loading...</li>';
            try {
                const res = await fetch(`/conversation-ids?email=${encodeURIComponent(userEmail)}`);
                if (res.ok) {
                    const ids = await res.json();
                    convList.innerHTML = '';
                    if (ids.length === 0) {
                        convList.innerHTML = '<li class="text-gray-500">No conversations found.</li>';
                    } else {
                        ids.forEach(id => {
                            const li = document.createElement('li');
                            li.className = 'flex items-center justify-between hover:bg-blue-100 p-2 rounded group';
                            const span = document.createElement('span');
                            let displayName = id;
                            if (id === userEmail) {
                                displayName = userEmail;
                            } else if (id.startsWith(userEmail + '_')) {
                                displayName = id.substring((userEmail + '_').length);
                            }
                            span.innerText = displayName;
                            li.onclick = async function (e) {
                                // Prevent menu click from triggering conversation load
                                if (e.target.closest('.menu-btn, .menu-dropdown')) return;
                                window.conversationId = id;
                                // Update page title with conversation name
                                if (id !== userEmail) {
                                    document.title = displayName;
                                }
                                const chatMessages = document.getElementById('chat-messages');
                                if (chatMessages) chatMessages.innerHTML = '';
                                try {
                                    const response = await fetch(`/conversation?conversationId=${encodeURIComponent(id)}`);
                                    if (response.ok) {
                                        const history = await response.json();
                                        history.forEach((msg, idx) => {
                                            const sender = idx % 2 === 0 ? 'User' : 'Bot';
                                            addMessageToChat(sender, msg);
                                        });
                                    }
                                } catch (e) {
                                    console.error('Failed to load chat history:', e);
                                }
                            };
                            li.appendChild(span);
                            // Add three-dot menu for non-default conversations
                            if (id !== userEmail) {
                                const menuBtn = document.createElement('button');
                                menuBtn.innerHTML = '&#x22EE;'; // vertical ellipsis
                                menuBtn.className = 'menu-btn ml-2 text-gray-500 hover:text-gray-800 focus:outline-none';
                                menuBtn.style.fontSize = '18px';
                                menuBtn.onclick = function (e) {
                                    e.stopPropagation();
                                    // Toggle dropdown
                                    dropdownMenu.classList.toggle('hidden');
                                };
                                // Dropdown menu
                                const dropdownMenu = document.createElement('div');
                                dropdownMenu.className = 'menu-dropdown absolute z-10 right-8 mt-2 w-28 bg-white border border-gray-200 rounded shadow-lg hidden';
                                // Rename button
                                const renameBtn = document.createElement('button');
                                renameBtn.className = 'block w-full text-left px-4 py-2 text-sm text-blue-600 hover:bg-gray-100';
                                renameBtn.innerText = 'Rename';
                                renameBtn.onclick = async function (e) {
                                    e.stopPropagation();
                                    dropdownMenu.classList.add('hidden');
                                    const newName = prompt('Enter new conversation name:');
                                    if (!newName) return;
                                    try {
                                        const res = await fetch(`/conversation-title?conversationId=${encodeURIComponent(id)}&newName=${encodeURIComponent(newName)}`, {method: 'PUT'});
                                        const newConversationId = await res.text();
                                        if (res.ok && newConversationId && !newConversationId.startsWith('Failed')) {
                                            span.innerText = newName;
                                            // Update window.conversationId if this conversation is selected
                                            if (window.conversationId === id) {
                                                window.conversationId = newConversationId;
                                            }
                                            // Also update the id variable for this li (for future menu actions)
                                            id = newConversationId;
                                            alert('Conversation renamed successfully!');
                                        } else {
                                            alert('Failed to rename conversation.');
                                        }
                                    } catch (err) {
                                        alert('Error renaming conversation.');
                                    }
                                };
                                dropdownMenu.appendChild(renameBtn);
                                // Delete button
                                const delBtn = document.createElement('button');
                                delBtn.className = 'block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100';
                                delBtn.innerText = 'Delete';
                                delBtn.onclick = async function (e) {
                                    e.stopPropagation();
                                    dropdownMenu.classList.add('hidden');
                                    if (!confirm('Are you sure you want to delete this conversation?')) return;
                                    await fetch(`/conversation?conversationId=${encodeURIComponent(id)}`, {method: 'DELETE'});
                                    window.conversationId = userEmail;
                                    const chatMessages = document.getElementById('chat-messages');
                                    if (chatMessages) chatMessages.innerHTML = '';
                                    li.remove();
                                };
                                dropdownMenu.appendChild(delBtn);
                                // Positioning wrapper
                                const menuWrapper = document.createElement('div');
                                menuWrapper.className = 'relative flex items-center';
                                menuWrapper.appendChild(menuBtn);
                                menuWrapper.appendChild(dropdownMenu);
                                li.appendChild(menuWrapper);
                                // Hide dropdown when clicking outside
                                document.addEventListener('click', function hideMenu(e) {
                                    if (!menuWrapper.contains(e.target)) {
                                        dropdownMenu.classList.add('hidden');
                                    }
                                });
                            }
                            convList.appendChild(li);
                        });
                    }
                } else {
                    convList.innerHTML = '<li class="text-red-500">Failed to load conversations.</li>';
                }
            } catch (e) {
                convList.innerHTML = '<li class="text-red-500">Error loading conversations.</li>';
            }
        }

        // Sidebar: Add Conversation logic
        const addBtn = document.getElementById('add-conversation-btn');
        if (addBtn && userEmail) {
            addBtn.addEventListener('click', function () {
                // Clear chat messages and unset conversationId
                const chatMessages = document.getElementById('chat-messages');
                if (chatMessages) chatMessages.innerHTML = '';
                window.conversationId = null;
            });
        }
    });

    chatForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const message = messageInput.value;
        const imageInput = document.getElementById('image-input');
        const imagePreview = document.getElementById('image-preview');
        const imageSelected = document.getElementById('image-selected');
        const imageFile = imageInput && imageInput.files.length > 0 ? imageInput.files[0] : null;
        if (!message && !imageFile) return;

        // Add user message to chat
        if (message) addMessageToChat('User', message);

        // Clear input
        messageInput.value = '';
        if (imageInput) {
            imageInput.value = '';
            // Also hide the image preview and indicator dot
            imagePreview.classList.add('hidden');
            imageSelected.classList.add('hidden');
        }

        try {
            // Check if conversationId is null, if so, call generateConversationId first
            if (!window.conversationId) {
                const formData = new FormData();
                formData.append('message', message);

                const response = await fetch('/conversation-id', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Failed to generate conversation ID');

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let generatedId = "";

                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    generatedId += decoder.decode(value, {stream: true});
                }

                window.conversationId = generatedId.trim();
                console.log("Generated new conversation ID:", window.conversationId);

                // Add the new conversation to the sidebar
                const convList = document.getElementById('conversation-list');
                if (convList) {
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between hover:bg-blue-100 p-2 rounded group';

                    // Set display name as the part after email_ or just the ID
                    let displayName = window.conversationId;
                    if (userEmail && window.conversationId.startsWith(userEmail + '_')) {
                        displayName = window.conversationId.substring((userEmail + '_').length);
                    }

                    const span = document.createElement('span');
                    span.innerText = displayName;
                    li.appendChild(span);

                    // Add click handler to load this conversation
                    li.onclick = async function (e) {
                        // Prevent menu click from triggering conversation load
                        if (e.target.closest('.menu-btn, .menu-dropdown')) return;

                        // Set as current conversation
                        window.conversationId = generatedId.trim();

                        // Clear and reload messages
                        const chatMessages = document.getElementById('chat-messages');
                        if (chatMessages) chatMessages.innerHTML = '';

                        try {
                            const response = await fetch(`/conversation?conversationId=${encodeURIComponent(window.conversationId)}`);
                            if (response.ok) {
                                const history = await response.json();
                                history.forEach(msg => {
                                    addMessageToChat(null, msg);
                                });
                            }
                        } catch (e) {
                            console.error('Failed to load chat history:', e);
                        }
                    };

                    // Add three-dot menu for options
                    const menuBtn = document.createElement('button');
                    menuBtn.innerHTML = '&#x22EE;'; // vertical ellipsis
                    menuBtn.className = 'menu-btn ml-2 text-gray-500 hover:text-gray-800 focus:outline-none';
                    menuBtn.style.fontSize = '18px';
                    menuBtn.onclick = function (e) {
                        e.stopPropagation();
                        // Toggle dropdown
                        dropdownMenu.classList.toggle('hidden');
                    };

                    // Create dropdown menu
                    const dropdownMenu = document.createElement('div');
                    dropdownMenu.className = 'menu-dropdown absolute z-10 right-8 mt-2 w-28 bg-white border border-gray-200 rounded shadow-lg hidden';

                    // Rename button
                    const renameBtn = document.createElement('button');
                    renameBtn.className = 'block w-full text-left px-4 py-2 text-sm text-blue-600 hover:bg-gray-100';
                    renameBtn.innerText = 'Rename';
                    renameBtn.onclick = async function (e) {
                        e.stopPropagation();
                        dropdownMenu.classList.add('hidden');
                        const newName = prompt('Enter new conversation name:');
                        if (!newName) return;

                        try {
                            const res = await fetch(`/conversation-title?conversationId=${encodeURIComponent(window.conversationId)}&newName=${encodeURIComponent(newName)}`, {method: 'PUT'});
                            const newConversationId = await res.text();

                            if (res.ok && newConversationId && !newConversationId.startsWith('Failed')) {
                                span.innerText = newName;
                                // Update window.conversationId if this conversation is selected
                                window.conversationId = newConversationId;
                                alert('Conversation renamed successfully!');
                            } else {
                                alert('Failed to rename conversation.');
                            }
                        } catch (err) {
                            alert('Error renaming conversation.');
                        }
                    };
                    dropdownMenu.appendChild(renameBtn);

                    // Delete button
                    const delBtn = document.createElement('button');
                    delBtn.className = 'block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100';
                    delBtn.innerText = 'Delete';
                    delBtn.onclick = async function (e) {
                        e.stopPropagation();
                        dropdownMenu.classList.add('hidden');

                        if (!confirm('Are you sure you want to delete this conversation?')) return;

                        await fetch(`/conversation?conversationId=${encodeURIComponent(window.conversationId)}`, {method: 'DELETE'});
                        window.conversationId = userEmail;
                        const chatMessages = document.getElementById('chat-messages');
                        if (chatMessages) chatMessages.innerHTML = '';
                        li.remove();
                    };
                    dropdownMenu.appendChild(delBtn);

                    // Positioning wrapper
                    const menuWrapper = document.createElement('div');
                    menuWrapper.className = 'relative flex items-center';
                    menuWrapper.appendChild(menuBtn);
                    menuWrapper.appendChild(dropdownMenu);
                    li.appendChild(menuWrapper);

                    // Hide dropdown when clicking outside
                    document.addEventListener('click', function hideMenu(e) {
                        if (!menuWrapper.contains(e.target)) {
                            dropdownMenu.classList.add('hidden');
                        }
                    });

                    // Add the new conversation to the top of the list
                    if (convList.firstChild) {
                        convList.insertBefore(li, convList.firstChild);
                    } else {
                        convList.appendChild(li);
                    }
                }
            }

            // Now proceed with the stream endpoint call
            const formData = new FormData();
            formData.append('message', message);
            formData.append('conversationId', window.conversationId);
            if (imageFile) {
                formData.append('image', imageFile);
            }

            const response = await fetch('/stream', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Network response was not ok');
            const reader = response.body.getReader();
            let botMessageElement = addMessageToChat('Bot', '');
            let contentElement = botMessageElement.querySelector('.message-content');
            await processStream(reader, contentElement);
        } catch (error) {
            console.error('Error fetching chatbot response:', error);
            addMessageToChat('System', 'An error occurred while fetching the response. Please try again.');
        }
    });

    async function fetchStreamWithRetry(url, retries = 3) {
        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url, {
                    credentials: 'include' // Send cookies with the request
                });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response;
            } catch (e) {
                console.error(`Attempt ${i + 1} failed: ${e.message}`);
                if (i === retries - 1) throw e;
                await new Promise(resolve => setTimeout(resolve, 1000)); // Wait 1 second before retrying
            }
        }
    }

    async function processStream(reader, contentElement) {
        const decoder = new TextDecoder("utf-8");
        let fullResponse = "";
        let buffer = "";

        try {
            document.getElementById('chat-messages-container').scrollTop = document.getElementById('chat-messages-container').scrollHeight;

            while (true) {
                const {done, value} = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, {stream: true});
                buffer += chunk;

                // Process complete JSON objects line by line
                let newlineIndex;
                while ((newlineIndex = buffer.indexOf('\n')) >= 0) {
                    const jsonLine = buffer.slice(0, newlineIndex).trim();
                    buffer = buffer.slice(newlineIndex + 1);

                    if (jsonLine) {
                        try {
                            const responseObj = JSON.parse(jsonLine);

                            if (responseObj) {
                                // Update conversationId if present
                                if (responseObj.conversationId) {
                                    window.conversationId = responseObj.conversationId;
                                }

                                // Update messageId if present
                                if (responseObj.messageId) {
                                    const messageElement = contentElement.closest('.bot-message');
                                    if (messageElement) {
                                        messageElement.setAttribute('data-message-id', responseObj.messageId);

                                        // Also update any rating buttons
                                        const ratingButtons = messageElement.querySelectorAll('.rate-btn');
                                        ratingButtons.forEach(btn => {
                                            btn.setAttribute('data-message-id', responseObj.messageId);
                                        });
                                    }
                                }

                                // Process content if present
                                if (responseObj.content) {
                                    fullResponse += responseObj.content;
                                    contentElement.innerHTML = fullResponse;

                                    // Scroll to bottom as content is added
                                    const chatMessagesContainer = document.getElementById('chat-messages-container');
                                    if (chatMessagesContainer) {
                                        chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
                                    }
                                }
                            }
                        } catch (e) {
                            console.warn("Failed to parse line as JSON:", e, jsonLine);
                        }
                    }
                }
            }

            // Process any remaining data in the buffer
            if (buffer.trim()) {
                try {
                    const responseObj = JSON.parse(buffer.trim());
                    if (responseObj && responseObj.content) {
                        fullResponse += responseObj.content;
                        contentElement.innerHTML = fullResponse;
                    }
                } catch (e) {
                    console.warn("Failed to parse remaining buffer as JSON:", e);
                }
            }

            extractAndSendJSON(fullResponse);
        } catch (error) {
            console.error('Error processing stream:', error);
            contentElement.innerHTML += '<br>[Error: Stream interrupted. Please try again.]';
        }
    }

    function addMessageToChat(sender, content) {
        // If content is a ChatbotResponse object, extract its properties
        let messageContent = content;
        let messageSender = sender;
        let messageId = null;

        if (typeof content === 'object') {
            // Extract properties from ChatbotResponse
            messageContent = content.content || '';
            messageId = content.messageId || null;

            // Determine sender based on messageType if available
            if (content.messageType) {
                messageSender = content.messageType === 'USER' ? 'User' : 'Bot';
            }
        }

        const messageElement = document.createElement('div');
        messageElement.className = `${messageSender.toLowerCase()}-message ${messageSender === 'User' ? 'bg-blue-100' : 'bg-gray-100'} p-3 rounded-lg`;

        // Add a data-message-id attribute if messageId is available
        if (messageId) {
            messageElement.setAttribute('data-message-id', messageId);
        }

        messageElement.innerHTML = `
            <div class="font-bold ${messageSender === 'User' ? 'text-blue-600' : 'text-green-600'}">${messageSender}:</div>
            <div class="message-content">${messageContent}</div>
            ${messageSender === 'Bot' && messageId ? `
            <div class="rating-buttons flex items-center mt-2 space-x-2">
                <button class="rate-btn thumbs-up text-gray-400 hover:text-green-500" data-rating="LIKE" data-message-id="${messageId}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z" />
                    </svg>
                </button>
                <button class="rate-btn thumbs-down text-gray-400 hover:text-red-500" data-rating="DISLIKE" data-message-id="${messageId}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M18 9.5a1.5 1.5 0 11-3 0v-6a1.5 1.5 0 013 0v6zM14 9.667v-5.43a2 2 0 00-1.105-1.79l-.05-.025A4 4 0 0010.943 2H5.57a2 2 0 00-1.962 1.608l-1.2 6A2 2 0 004.44 12H8v4a2 2 0 002 2 1 1 0 001-1v-.667a4 4 0 01.8-2.4l1.4-1.866a4 4 0 00.8-2.4z" />
                    </svg>
                </button>
            </div>` : ''}
        `;
        chatMessages.appendChild(messageElement);
        // Scroll chat messages area to bottom
        const chatMessagesContainer = document.getElementById('chat-messages-container');
        if (chatMessagesContainer) {
            chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
        }
        return messageElement;
    }

    function extractAndSendJSON(fullResponse) {
        const jsonMatch = fullResponse.match(/```json\s*([\s\S]*?)```/);

        if (jsonMatch && jsonMatch[1]) {
            try {
                const json = JSON.parse(jsonMatch[1]);
                console.log("✅ JSON extracted:", json);

                // Create a generate test button
                const generateButtonDiv = document.createElement('div');
                generateButtonDiv.className = 'mt-4 flex justify-center';
                generateButtonDiv.innerHTML = `
                    <button id="generate-test-btn" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500">
                        Generate TOEIC Test
                    </button>
                `;

                // Add button to the chat
                chatMessages.appendChild(generateButtonDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Add click event listener to the button
                document.getElementById('generate-test-btn').addEventListener('click', function () {
                    // Display loading state
                    this.disabled = true;
                    this.innerHTML = 'Generating...';

                    // Send JSON to backend
                    fetch('/chat/generate-test', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(json),
                        redirect: 'follow'
                    }).then(response => {
                        if (response.redirected) {
                            // If server returned a redirect, follow it
                            window.location.href = response.url;
                        } else if (response.ok) {
                            // If we get HTML content directly, load it
                            return response.text().then(html => {
                                document.open();
                                document.write(html);
                                document.close();
                            });
                        } else {
                            console.error("❌ Failed to generate test");
                            addMessageToChat('System', 'Failed to generate test. Please try again.');
                            // Re-enable the button
                            this.disabled = false;
                            this.innerHTML = 'Generate TOEIC Test';
                        }
                    }).catch(err => {
                        console.error("❌ Error generating test:", err);
                        addMessageToChat('System', 'An error occurred while generating the test.');
                        // Re-enable the button
                        this.disabled = false;
                        this.innerHTML = 'Generate TOEIC Test';
                    });
                });
            } catch (e) {
                console.error("❌ JSON parse error:", e);
            }
        }
    }

    // Add script to show indicator when an image is selected
    document.addEventListener('DOMContentLoaded', function () {
        const imageInput = document.getElementById('image-input');
        const imageSelected = document.getElementById('image-selected');
        const imagePreview = document.getElementById('image-preview');
        const previewImage = document.getElementById('preview-image');

        imageInput.addEventListener('change', function () {
            if (imageInput.files.length > 0) {
                const file = imageInput.files[0];
                const reader = new FileReader();

                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                    // Show the indicator dot
                    imageSelected.classList.remove('hidden');
                };

                reader.readAsDataURL(file);
            } else {
                imagePreview.classList.add('hidden');
                imageSelected.classList.add('hidden');
            }
        });

        // Remove image button functionality
        document.getElementById('remove-image-btn').addEventListener('click', function (e) {
            e.preventDefault(); // Prevent form submission if clicked
            imageInput.value = '';
            imagePreview.classList.add('hidden');
            imageSelected.classList.add('hidden');
        });

        // Add event listener for rating buttons
        document.addEventListener('click', async function (e) {
            if (e.target.closest('.rate-btn')) {
                const rateBtn = e.target.closest('.rate-btn');
                const messageId = rateBtn.getAttribute('data-message-id');
                const rating = rateBtn.getAttribute('data-rating');

                if (!messageId || !rating) return;

                // Mark the selected button as active and disable both buttons
                const messageElement = rateBtn.closest(`[data-message-id="${messageId}"]`);
                const ratingButtons = messageElement.querySelectorAll('.rate-btn');

                // Visual feedback
                ratingButtons.forEach(btn => {
                    btn.disabled = true;
                    btn.classList.remove('text-green-500', 'text-red-500');
                    btn.classList.add('text-gray-400');
                });

                if (rating === 'LIKE') {
                    rateBtn.classList.remove('text-gray-400');
                    rateBtn.classList.add('text-green-500');
                } else {
                    rateBtn.classList.remove('text-gray-400');
                    rateBtn.classList.add('text-red-500');
                }

                try {
                    const response = await fetch('/ratings/chatbot-rate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            messageId: messageId,
                            rating: rating,
                            feedback: null // Optional feedback can be added later if needed
                        })
                    });

                    if (response.ok) {
                        console.log('Rating submitted successfully');
                        // Add a small notification
                        const notification = document.createElement('div');
                        notification.className = 'text-xs text-gray-500 mt-1';
                        notification.textContent = 'Thank you for your feedback!';
                        rateBtn.parentElement.appendChild(notification);

                        // Remove notification after 3 seconds
                        setTimeout(() => {
                            notification.remove();
                        }, 3000);
                    } else {
                        console.error('Failed to submit rating');
                        // Re-enable buttons if submission fails
                        ratingButtons.forEach(btn => {
                            btn.disabled = false;
                        });
                    }
                } catch (error) {
                    console.error('Error submitting rating:', error);
                    // Re-enable buttons if submission fails
                    ratingButtons.forEach(btn => {
                        btn.disabled = false;
                    });
                }
            }
        });
    });
</script>

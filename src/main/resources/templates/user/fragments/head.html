<head th:fragment="head(title)">
<meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${title} ?: 'TOEIC Mentor'"></title>
    <meta name="description" content="A best clean, modern, stylish, creative, responsive theme for different eCommerce business or industries.">
    <meta name="keywords" content="medical theme, vegetables, medicine store, eCommerce html template, responsive, multipurpose, mask, sanitizer, eCommerce store, health, tables, dental, healthcare, pharmacy, herbal, medicine shop">
    <meta name="author" content="spacingtech_webify">
    <!-- favicon -->
    <link rel="shortcut icon" type="image/favicon" th:href="@{/user/asset/image/home1/favicon.png}">
    <!-- plugin css -->
    <link rel="stylesheet" type="text/css" th:href="@{/user/asset/css/plugin.css}">
    <!-- collection css -->
    <link rel="stylesheet" type="text/css" th:href="@{/user/asset/css/collection.css}">
    <!-- feather -->
    <link rel="stylesheet" type="text/css" th:href="@{/user/asset/css/feather.css}">
    <!-- blog css -->
    <link rel="stylesheet" type="text/css" th:href="@{/user/asset/css/blog.css}">
    <!-- other-pages css -->
    <link rel="stylesheet" type="text/css" th:href="@{/user/asset/css/other-pages.css}">
    <!-- product-page css -->
    <link rel="stylesheet" type="text/css" th:href="@{/user/asset/css/product-page.css}">
    <!-- style css -->
    <link rel="stylesheet" type="text/css" th:href="@{/user/asset/css/style1.css}">
    
    <!-- Chart section custom styles -->
    <style>
        .recent-tests-chart-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 60px 0;
        }
        
        .chart-container {
            background: #ffffff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }
        
        .chart-controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }
        
        .chart-wrapper {
            position: relative;
            height: 400px;
            margin-top: 20px;
        }
        
        .chart-wrapper canvas {
            border-radius: 10px;
        }
        
        #chartLoading {
            padding: 40px 20px;
        }
        
        #chartNoData {
            padding: 40px 20px;
        }
        
        #chartNoData .alert {
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            color: #1976d2;
        }
        
        .form-select {
            border-radius: 8px;
            border: 2px solid #dee2e6;
            transition: all 0.3s ease;
        }
        
        .form-select:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        
        .btn-style1 {
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-style1:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }
        
        @media (max-width: 768px) {
            .chart-container {
                padding: 20px;
            }
            
            .chart-wrapper {
                height: 300px;
            }
            
            .chart-controls .row {
                text-align: center;
            }
            
            .chart-controls .col-md-6:last-child {
                margin-top: 15px;
            }
        }
    </style>
</head>
